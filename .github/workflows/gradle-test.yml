name: Gradle Test
on:
    workflow_call:
        inputs:
            java-version:
                type: string
                default: "17"
            gradle-task:
                type: string
                default: "test"

permissions: {}

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: $/actions/setup-gradle-java
              with:
                  java-version: ${{ inputs.java-version }}

            - name: Run Gradle tests
              env:
                  GRADLE_OPTS: >-
                      -Xmx4g -XX:MaxMetaspaceSize=512m
                  GRADLE_TASK: ${{ inputs.gradle-task }}
              run: |
                  ./gradlew --no-daemon \
                    --max-workers=1 "$GRADLE_TASK"

            - name: Upload JUnit results
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: junit-results
                  path: "**/build/test-results/**/*.xml"
                  retention-days: 7
                  if-no-files-found: warn

            - name: Upload test diagnostics
              if: failure()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: gradle-test-diagnostics
                  path: "**/build/reports/tests/**"
                  retention-days: 7
                  if-no-files-found: warn