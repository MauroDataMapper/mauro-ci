name: Upload SARIF

on:
    workflow_call:
        inputs:
            artifact-name:
                description: Name of the uploaded artifact
                type: string
                default: megalinter-reports

            category:
                description: Code scanning category
                type: string
                default: MegaLinter-Groovy

permissions: {}

jobs:
    upload:
        if: >-
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             github.ref == 'refs/heads/develop')

        runs-on: ubuntu-latest
        timeout-minutes: 15

        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Download MegaLinter artifact
              uses: actions/download-artifact@v8.0.2
              with:
                  name: ${{ inputs.artifact-name }}
                  path: reports

            - name: Verify SARIF exists
              shell: bash
              run: |
                  test -s reports/megalinter-reports/megalinter-report.sarif

            - name: Upload SARIF to GitHub
              uses: github/codeql-action/upload-sarif@v3.39.2
              with:
                  sarif_file: reports/megalinter-reports/megalinter-report.sarif
                  category: ${{ inputs.category }}
                  wait-for-processing: true