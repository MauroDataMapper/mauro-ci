name: Workflow Security Checks

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6.1.0
              with:
                  persist-credentials: false

            - uses: actions/setup-go@v6.5.0
              with:
                  go-version: stable

            - name: Install actionlint
              run: |
                  go install github.com/rhysd/actionlint/cmd/actionlint@latest

            - name: Validate workflows
              run: |
                  "$(go env GOPATH)/bin/actionlint"

    zizmor:
        name: zizmor
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6.1.0
              with:
                  persist-credentials: false

            - uses: actions/setup-python@v6.3.0
              with:
                  python-version: "3.13"

            - name: Install zizmor
              run: |
                  python -m pip install zizmor

            - name: Audit workflows and actions
              run: |
                  zizmor --config .github/zizmor.yml --strict-collection .