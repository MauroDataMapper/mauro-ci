
name: Zulip Notify

on:
    workflow_call:
        inputs:
            build-result:
                description: Build/test job result
                type: string
                default: skipped

            lint-result:
                description: Lint job result
                type: string
                default: skipped

            docker-result:
                description: Docker build/publish result
                type: string
                default: skipped

            snapshot-result:
                description: Snapshot publication result
                type: string
                default: skipped

            maven-result:
                description: Maven Central publication result
                type: string
                default: skipped

            workflow-name:
                description: Name of the calling workflow
                type: string
                default: CI

        secrets:
            ZULIP_API_KEY:
                required: true

permissions: {}

jobs:
    notify:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Determine overall result
              id: status
              shell: bash
              env:
                  BUILD_RESULT: ${{ inputs.build-result }}
                  LINT_RESULT: ${{ inputs.lint-result }}
                  DOCKER_RESULT: ${{ inputs.docker-result }}
                  SNAPSHOT_RESULT: ${{ inputs.snapshot-result }}
                  MAVEN_RESULT: ${{ inputs.maven-result }}
              run: |
                  set -euo pipefail
                  
                  results="$BUILD_RESULT $LINT_RESULT $DOCKER_RESULT $SNAPSHOT_RESULT $MAVEN_RESULT"
                  
                  if [[ " $results " == *" failure "* ]]; then
                    echo "icon=:cross_mark:" >> "$GITHUB_OUTPUT"
                    echo "status=FAILED" >> "$GITHUB_OUTPUT"
                  elif [[ " $results " == *" cancelled "* ]]; then
                    echo "icon=:warning:" >> "$GITHUB_OUTPUT"
                    echo "status=CANCELLED" >> "$GITHUB_OUTPUT"
                  elif [[ " $results " == *" success "* ]]; then
                    echo "icon=:check_mark:" >> "$GITHUB_OUTPUT"
                    echo "status=PASSED" >> "$GITHUB_OUTPUT"
                  else
                    echo "icon=:warning:" >> "$GITHUB_OUTPUT"
                    echo "status=SKIPPED" >> "$GITHUB_OUTPUT"
                  fi

            - name: Send Zulip notification
              uses: zulip/github-actions-zulip/send-message@v2.0.2
              with:
                  api-key: ${{ secrets.ZULIP_API_KEY }}
                  email: githubactionsbot-bot@maurodatamapper.zulipchat.com
                  organization-url: https://maurodatamapper.zulipchat.com
                  to: build/github-actions
                  type: stream
                  topic: ${{ github.repository }}

                  content: >-
                      ${{ steps.status.outputs.icon }}
                      **${{ steps.status.outputs.status }}**
                      — ${{ inputs.workflow-name }}
                      
                      **Repository:** ${{ github.repository }}
                      
                      **Branch / Merge:** ${{ github.head_ref || github.ref_name }}
                      
                      **Event:** ${{ github.event_name }}
                      
                      **Actor:** ${{ github.actor }}
                      
                      **Commit:** `${{ github.sha }}`
                      
                      **Results:**
                      Build=${{ inputs.build-result }},
                      Lint=${{ inputs.lint-result }},
                      Docker=${{ inputs.docker-result }},
                      Snapshot=${{ inputs.snapshot-result }},
                      Maven=${{ inputs.maven-result }}
                      
                      [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
