name: Zulip Notification

on:
    workflow_call:
        inputs:
            build-result:
                type: string
                required: true

            snapshot-result:
                type: string
                default: skipped

            maven-result:
                type: string
                default: skipped

            docker-result:
                type: string
                default: skipped

        secrets:
            ZULIP_API_KEY:
                required: true

permissions: {}

jobs:
    notify:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Send Zulip notification
              uses: zulip/github-actions-zulip/send-message@v2.0.2
              with:
                  api-key: ${{ secrets.ZULIP_API_KEY }}
                  email: githubactionsbot-bot@maurodatamapper.zulipchat.com
                  organization-url: https://maurodatamapper.zulipchat.com
                  to: build/github-actions
                  type: stream
                  topic: ${{ github.repository }}

                  content: >-
                      Build results for ${{ github.repository }}
                      on ${{ github.ref }}:
                      
                      Build: ${{ inputs.build-result }}
                      Snapshot: ${{ inputs.snapshot-result }}
                      Maven Central: ${{ inputs.maven-result }}
                      Docker: ${{ inputs.docker-result }}
                      
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}