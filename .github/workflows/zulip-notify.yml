name: Zulip Notify

on:
    workflow_call:
        inputs:
            workflow-name:
                type: string
                required: true
            conclusion:
                type: string
                required: true
            run-url:
                type: string
                required: true
            run-id:
                type: string
                default: ""
            run-attempt:
                type: string
                default: "1"
            repository:
                type: string
                default: ""
            branch:
                type: string
                default: ""
            commit:
                type: string
                default: ""
            actor:
                type: string
                default: ""
            event-name:
                type: string
                default: ""
            started-at:
                type: string
                default: ""
            pr-number:
                type: string
                default: ""

        secrets:
            ZULIP_API_KEY:
                required: true
            ZULIP_BOT_EMAIL:
                required: true

permissions: {}

jobs:
    notify:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        permissions:
            actions: read

        steps:
            - name: Fetch failed jobs
              id: jobs
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ inputs.repository }}
                  RUN_ID: ${{ inputs.run-id }}
                  RUN_ATTEMPT: ${{ inputs.run-attempt }}
              run: |
                  set -euo pipefail
                  
                  if [[ -z "$RUN_ID" || -z "$REPOSITORY" ]]; then
                    echo 'failed_jobs=[]' >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  
                  # Fetch jobs for this particular run attempt.
                  if ! jobs=$(gh api \
                    "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
                    --paginate \
                    --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name'); then
                    echo "::warning::Could not retrieve failed job names"
                    jobs=""
                  fi
                  
                  {
                    echo 'failed_jobs<<EOF'
                    printf '%s\n' "$jobs"
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"