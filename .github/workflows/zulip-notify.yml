
name: Zulip Notify

on:
    workflow_call:
        inputs:
            build-result:
                description: Build/test job result
                type: string
                default: skipped

            lint-result:
                description: Lint job result
                type: string
                default: skipped

            docker-result:
                description: Docker build/publish result
                type: string
                default: skipped

            snapshot-result:
                description: Snapshot publication result
                type: string
                default: skipped

            maven-result:
                description: Maven Central publication result
                type: string
                default: skipped

            workflow-name:
                description: Name of the calling workflow
                type: string
                default: CI

        secrets:
            ZULIP_API_KEY:
                required: true

permissions: {}

jobs:
    notify:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Determine overall result
              id: status
              shell: bash
              env:
                  BUILD_RESULT: ${{ inputs.build-result }}
                  LINT_RESULT: ${{ inputs.lint-result }}
                  DOCKER_RESULT: ${{ inputs.docker-result }}
                  SNAPSHOT_RESULT: ${{ inputs.snapshot-result }}
                  MAVEN_RESULT: ${{ inputs.maven-result }}
                  SERVER_URL: ${{ github.server_url }}
                  REPOSITORY: ${{ github.repository }}
                  HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  
                  results="$BUILD_RESULT $LINT_RESULT $DOCKER_RESULT $SNAPSHOT_RESULT $MAVEN_RESULT"
                  
                  if [[ " $results " == *" failure "* ]]; then
                    echo "icon=:cross_mark:" >> "$GITHUB_OUTPUT"
                    echo "status=FAILED" >> "$GITHUB_OUTPUT"
                  elif [[ " $results " == *" cancelled "* ]]; then
                    echo "icon=:warning:" >> "$GITHUB_OUTPUT"
                    echo "status=CANCELLED" >> "$GITHUB_OUTPUT"
                  elif [[ " $results " == *" success "* ]]; then
                    echo "icon=:check_mark:" >> "$GITHUB_OUTPUT"
                    echo "status=PASSED" >> "$GITHUB_OUTPUT"
                  else
                    echo "icon=:warning:" >> "$GITHUB_OUTPUT"
                    echo "status=SKIPPED" >> "$GITHUB_OUTPUT"
                  fi

                  if [[ -n "$PR_NUMBER" ]]; then
                    SOURCE_URL="$SERVER_URL/$REPOSITORY/pull/$PR_NUMBER"
                    SOURCE_LABEL="View pull request"
                  else
                    SOURCE_URL="$SERVER_URL/$HEAD_REPOSITORY/commit/$COMMIT"
                    SOURCE_LABEL="View commit"
                  fi

                  echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"
                  echo "source_label=$SOURCE_LABEL" >> "$GITHUB_OUTPUT"

            - name: Send Zulip notification
              uses: zulip/github-actions-zulip/send-message@v2.0.2
              with:
                  api-key: ${{ secrets.ZULIP_API_KEY }}
                  email: githubactionsbot-bot@maurodatamapper.zulipchat.com
                  organization-url: https://maurodatamapper.zulipchat.com
                  to: build/github-actions
                  type: stream
                  topic: ${{ github.repository }}

                  content: >-
                      ${{ steps.status.outputs.icon }}
                      **${{ steps.status.outputs.status }}**
                      **${{ github.repository }}** (${{ inputs.workflow-name }})

                      ${{ github.head_ref || github.ref_name }} / ${{ github.actor }}
                      (${{ github.event_name }})

                      `${{ github.sha }}` (Attempt ${{ github.run_attempt }})

                      [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
                      [${{ steps.status.outputs.source_label }}](${{ steps.status.outputs.source_url }})
