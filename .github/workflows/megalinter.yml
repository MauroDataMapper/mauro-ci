name: MegaLinter

on:
    workflow_call:
        inputs:
            language:
                type: string
                required: true

            scan-mode:
                type: string
                default: changed

            scan-pr-commits:
                description: Scan all commits between the pull request base and head for secrets
                type: boolean
                default: false

permissions: {}

jobs:
    lint:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout consuming repository
              uses: actions/checkout@v6.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install shared lint configuration
              uses: $/actions/prepare-megalinter
              with:
                  language: ${{ inputs.language }}
                  scan-mode: ${{ inputs.scan-mode }}

            - name: Run MegaLinter for Groovy
              if: inputs.language == 'groovy'
              uses: oxsecurity/megalinter/flavors/java@v10.1.0
              env:
                  VALIDATE_ALL_CODEBASE: ${{ inputs.scan-mode == 'full' }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  DISABLE_ERRORS: "true"
                  SARIF_REPORTER: "true"
                  PULL_REQUEST: ${{ inputs.scan-pr-commits && github.event_name == 'pull_request' }}
                  REPOSITORY_GITLEAKS_PR_COMMITS_SCAN: ${{ inputs.scan-pr-commits && github.event_name == 'pull_request' }}
                  REPOSITORY_GITLEAKS_PR_SOURCE_SHA: ${{ inputs.scan-pr-commits && github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
                  REPOSITORY_GITLEAKS_PR_TARGET_SHA: ${{ inputs.scan-pr-commits && github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
                  GITHUB_TOKEN: ${{ inputs.scan-pr-commits && github.event_name == 'pull_request' && github.token || '' }}

            - name: Check SARIF output
              if: always()
              shell: bash
              run: |
                  if [[ -f megalinter-reports/megalinter-report.sarif ]]; then
                    echo "SARIF report generated"
                    ls -lh megalinter-reports/megalinter-report.sarif
                  else
                    echo "No SARIF report generated"
                  fi

            - name: Upload MegaLinter reports
              if: always()
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: megalinter-reports
                  path: |
                      megalinter-reports/
                      mega-linter.log
                  retention-days: 7
                  if-no-files-found: warn