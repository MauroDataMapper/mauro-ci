name: Node.js CI

on:
    workflow_call:
        inputs:
            node-version:
                type: string
                default: "24"

            working-directory:
                type: string
                default: "."

            cache-dependency-path:
                type: string
                default: package-lock.json

            linked-package-repository:
                description: Optional public GitHub repository for an npm package to link
                type: string
                default: ""

            linked-package-ref:
                description: Branch, tag, or commit to check out for the linked package
                type: string
                default: ""

            linked-package-path:
                description: Workspace path for the checked-out linked package
                type: string
                default: linked-package

            linked-package-name:
                description: npm package name to link into the consuming project
                type: string
                default: ""

            linked-package-build-script:
                description: Optional npm build script for the linked package
                type: string
                default: build

            linked-package-use-npm-ci:
                description: Use npm ci rather than npm install for the linked package
                type: boolean
                default: true

            verify-tools:
                description: Newline-separated local executables to report versions for
                type: string
                default: ""

            verify-dependencies:
                description: Newline-separated npm dependencies to verify with npm ls
                type: string
                default: ""

            report-symlinked-names:
                description: Report npm-linked package names after linking dependencies
                type: boolean
                default: false

            license-script:
                description: Optional npm script to run before tests
                type: string
                default: ""

            license-argument:
                description: Optional single argument for the license script
                type: string
                default: ""

            test-script:
                description: npm script to run for tests (mutually exclusive with test-executable)
                type: string
                default: ""

            test-executable:
                description: Optional executable to run for tests instead of an npm script
                type: string
                default: ""

            test-arguments:
                description: Whitespace-separated arguments for test-executable
                type: string
                default: ""

            lint-script:
                description: Optional npm script to run for linting
                type: string
                default: ""

            lint-continue-on-error:
                description: Keep the workflow successful when the lint script fails
                type: boolean
                default: false

            sarif-script:
                description: Optional npm script to generate SARIF
                type: string
                default: ""

            sarif-continue-on-error:
                description: Keep the workflow successful when SARIF generation fails
                type: boolean
                default: true

            build-script:
                description: Optional npm script to build the project
                type: string
                default: ""

            test-junit-path:
                description: Optional JUnit XML path relative to the repository root
                type: string
                default: ""

            lint-junit-path:
                description: Optional lint JUnit XML path relative to the repository root
                type: string
                default: ""

            sarif-path:
                description: Optional SARIF path relative to the repository root
                type: string
                default: ""

            build-artifact-path:
                description: Optional build output path relative to the repository root
                type: string
                default: ""

            build-artifact-name:
                description: Name for the uploaded build artifact
                type: string
                default: node-build

        outputs:
            unit-junit-artifact-id:
                description: Uploaded unit-test JUnit artifact ID, if present
                value: ${{ jobs.ci.outputs.unit-junit-artifact-id }}

            lint-junit-artifact-id:
                description: Uploaded lint JUnit artifact ID, if present
                value: ${{ jobs.ci.outputs.lint-junit-artifact-id }}

            sarif-artifact-id:
                description: Uploaded SARIF artifact ID, if present
                value: ${{ jobs.ci.outputs.sarif-artifact-id }}

            build-artifact-id:
                description: Uploaded build artifact ID, if present
                value: ${{ jobs.ci.outputs.build-artifact-id }}

permissions: {}

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        outputs:
            unit-junit-artifact-id: ${{ steps.upload-unit-junit.outputs.artifact-id }}
            lint-junit-artifact-id: ${{ steps.upload-lint-junit.outputs.artifact-id }}
            sarif-artifact-id: ${{ steps.upload-sarif.outputs.artifact-id }}
            build-artifact-id: ${{ steps.upload-build.outputs.artifact-id }}

        steps:
            - name: Checkout consuming repository
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js and install dependencies
              uses: $/actions/setup-node-npm
              with:
                  node-version: ${{ inputs.node-version }}
                  working-directory: ${{ inputs.working-directory }}
                  cache-dependency-path: ${{ inputs.cache-dependency-path }}

            - name: Link local npm package
              if: inputs.linked-package-repository != ''
              uses: $/actions/link-npm-package
              with:
                  repository: ${{ inputs.linked-package-repository }}
                  ref: ${{ inputs.linked-package-ref }}
                  path: ${{ inputs.linked-package-path }}
                  package-name: ${{ inputs.linked-package-name }}
                  working-directory: ${{ inputs.working-directory }}
                  build-script: ${{ inputs.linked-package-build-script }}
                  use-npm-ci: ${{ inputs.linked-package-use-npm-ci }}

            - name: Verify Node.js environment
              if: >-
                  inputs.verify-tools != '' ||
                  inputs.verify-dependencies != '' ||
                  inputs.report-symlinked-names
              uses: $/actions/verify-node-environment
              with:
                  working-directory: ${{ inputs.working-directory }}
                  tools: ${{ inputs.verify-tools }}
                  dependencies: ${{ inputs.verify-dependencies }}
                  report-symlinked-names: ${{ inputs.report-symlinked-names }}

            - name: Run license check
              if: inputs.license-script != ''
              uses: $/actions/check-license-headers
              with:
                  license-script: ${{ inputs.license-script }}
                  license-argument: ${{ inputs.license-argument }}
                  working-directory: ${{ inputs.working-directory }}

            - name: Validate test configuration
              shell: bash
              env:
                  TEST_SCRIPT: ${{ inputs.test-script }}
                  TEST_EXECUTABLE: ${{ inputs.test-executable }}
                  TEST_ARGUMENTS: ${{ inputs.test-arguments }}
              run: |
                  set -euo pipefail
                  if [[ -z "$TEST_SCRIPT" && -z "$TEST_EXECUTABLE" ]]; then
                    echo "Set either test-script or test-executable" >&2
                    exit 1
                  fi
                  if [[ -n "$TEST_SCRIPT" && -n "$TEST_EXECUTABLE" ]]; then
                    echo "Set only one of test-script or test-executable" >&2
                    exit 1
                  fi
                  if [[ -n "$TEST_ARGUMENTS" && -z "$TEST_EXECUTABLE" ]]; then
                    echo "test-arguments requires test-executable" >&2
                    exit 1
                  fi
                  if [[ -n "$TEST_EXECUTABLE" && ! "$TEST_EXECUTABLE" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                    echo "Invalid test-executable name" >&2
                    exit 1
                  fi

            - name: Run tests from npm script
              if: inputs.test-script != ''
              uses: $/actions/run-npm-script
              with:
                  npm-script: ${{ inputs.test-script }}
                  working-directory: ${{ inputs.working-directory }}

            - name: Run test executable
              if: inputs.test-executable != ''
              working-directory: ${{ inputs.working-directory }}
              shell: bash
              env:
                  TEST_EXECUTABLE: ${{ inputs.test-executable }}
                  TEST_ARGUMENTS: ${{ inputs.test-arguments }}
              run: |
                  set -euo pipefail
                  arguments=()
                  if [[ -n "$TEST_ARGUMENTS" ]]; then
                    read -r -a arguments <<< "$TEST_ARGUMENTS"
                  fi
                  "$TEST_EXECUTABLE" "${arguments[@]}"

            - name: Run lint
              if: inputs.lint-script != ''
              continue-on-error: ${{ inputs.lint-continue-on-error }}
              uses: $/actions/run-npm-script
              with:
                  npm-script: ${{ inputs.lint-script }}
                  working-directory: ${{ inputs.working-directory }}

            - name: Generate SARIF
              if: inputs.sarif-script != ''
              continue-on-error: ${{ inputs.sarif-continue-on-error }}
              uses: $/actions/run-npm-script
              with:
                  npm-script: ${{ inputs.sarif-script }}
                  working-directory: ${{ inputs.working-directory }}

            - name: Build project
              if: inputs.build-script != ''
              uses: $/actions/run-npm-script
              with:
                  npm-script: ${{ inputs.build-script }}
                  working-directory: ${{ inputs.working-directory }}

            - name: Upload unit-test JUnit results
              id: upload-unit-junit
              if: always() && inputs.test-junit-path != ''
              uses: $/actions/upload-junit-results
              with:
                  artifact-name: unit-junit-results
                  path: ${{ inputs.test-junit-path }}

            - name: Upload lint JUnit results
              id: upload-lint-junit
              if: always() && inputs.lint-junit-path != ''
              uses: $/actions/upload-junit-results
              with:
                  artifact-name: lint-junit-results
                  path: ${{ inputs.lint-junit-path }}

            - name: Upload SARIF results
              id: upload-sarif
              if: always() && inputs.sarif-path != ''
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: sarif-results
                  path: ${{ inputs.sarif-path }}
                  retention-days: 7
                  if-no-files-found: warn

            - name: Upload build artifact
              id: upload-build
              if: success() && inputs.build-artifact-path != ''
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: ${{ inputs.build-artifact-name }}
                  path: ${{ inputs.build-artifact-path }}
                  retention-days: 7
                  if-no-files-found: error
