
name: Security Check Notifications

on:
    workflow_call:
        inputs:
            conclusion:
                type: string
                required: true

        secrets:
            ZULIP_API_KEY:
                required: true
            ZULIP_BOT_EMAIL:
                required: true

permissions: {}

jobs:
    notify:
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Send Zulip notification
              shell: bash
              env:
                  ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
                  ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
                  ZULIP_URL: https://maurodatamapper.zulipchat.com
                  ZULIP_STREAM: build/github-actions
                  ZULIP_TOPIC: ${{github.repository}}

                  WORKFLOW: ${{ github.workflow }}
                  CONCLUSION: ${{ inputs.conclusion }}
                  REPOSITORY: ${{ github.repository }}
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  EVENT: ${{ github.event_name }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_URL: >-
                      ${{ format(
                          '{0}/{1}/actions/runs/{2}',
                          github.server_url,
                          github.repository,
                          github.run_id
                      ) }}

              run: |
                  set -euo pipefail
                  
                  case "$CONCLUSION" in
                    success)
                      STATUS=":check_mark: PASSED"
                      ;;
                    failure)
                      STATUS=":cross_mark: FAILED"
                      ;;
                    cancelled)
                      STATUS=":warning: CANCELLED"
                      ;;
                    skipped)
                      STATUS=":warning: SKIPPED"
                      ;;
                    timed_out)
                      STATUS=":warning: TIMED OUT"
                      ;;
                    action_required)
                      STATUS=":warning: ACTION REQUIRED"
                      ;;
                    *)
                      STATUS=":warning: ${CONCLUSION:-UNKNOWN}"
                      ;;
                  esac
                  
                  MESSAGE="$STATUS
                  **Repository:** $REPOSITORY
                  **Workflow:** $WORKFLOW
                  **Branch:** $BRANCH
                  **Event:** $EVENT
                  **Run ID:** $RUN_ID
                  **Result:** $CONCLUSION
                  [View GitHub Actions run]($RUN_URL)"
                  
                  curl \
                    --fail-with-body \
                    --silent \
                    --show-error \
                    --retry 3 \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --request POST \
                    --user "$ZULIP_BOT_EMAIL:$ZULIP_API_KEY" \
                    --data-urlencode "type=stream" \
                    --data-urlencode "to=$ZULIP_STREAM" \
                    --data-urlencode "topic=$ZULIP_TOPIC" \
                    --data-urlencode "content=$MESSAGE" \
                    "$ZULIP_URL/api/v1/messages"
              continue-on-error: true
