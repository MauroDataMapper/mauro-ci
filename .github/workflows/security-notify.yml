# SECURITY:
# This workflow intentionally uses workflow_run.
# It does not checkout code or download artifacts from the triggering run.
# It only reads workflow_run metadata and sends a Zulip notification.
# It has no GITHUB_TOKEN permissions.
# Review carefully before adding any steps or dependencies.

name: Security Check Notifications

on:
    workflow_run: # zizmor: ignore[dangerous-triggers]
        workflows:
            - Workflow Security Checks
            - Verify Actions Lock
        types:
            - completed

permissions: {}

jobs:
    notify:
        if: >-
            github.event.workflow_run.repository.full_name ==
            github.repository

        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Send security notification
              shell: bash
              env:
                  ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
                  ZULIP_BOT_EMAIL: ${{ vars.ZULIP_BOT_EMAIL }}

                  WORKFLOW: ${{ github.event.workflow_run.name }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  REPOSITORY: ${{ github.repository }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  ACTOR: ${{ github.event.workflow_run.actor.login }}
                  COMMIT: ${{ github.event.workflow_run.head_sha }}
                  EVENT: ${{ github.event.workflow_run.event }}
                  ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}

              run: |
                  set -euo pipefail
                  
                  case "$CONCLUSION" in
                    success)   STATUS=":check_mark: PASSED" ;;
                    failure)   STATUS=":cross_mark: FAILED" ;;
                    cancelled) STATUS=":warning: CANCELLED" ;;
                    *)         STATUS=":warning: $CONCLUSION" ;;
                  esac
                  
                  MESSAGE="$STATUS
                  **Workflow:** $WORKFLOW
                  **Repository:** $REPOSITORY
                  **Branch:** $BRANCH
                  **Actor:** $ACTOR
                  **Event:** $EVENT
                  **Commit:** ${COMMIT:0:12}
                  **Attempt:** $ATTEMPT
                  [View workflow run]($RUN_URL)"
                  
                  curl \
                    --fail-with-body \
                    --silent \
                    --show-error \
                    --retry 3 \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --user "$ZULIP_BOT_EMAIL:$ZULIP_API_KEY" \
                    --data-urlencode "type=stream" \
                    --data-urlencode "to=build" \
                    --data-urlencode "topic=github-actions-security" \
                    --data-urlencode "content=$MESSAGE" \
                    https://maurodatamapper.zulipchat.com/api/v1/messages