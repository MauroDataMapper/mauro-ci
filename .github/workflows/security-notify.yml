# SECURITY:
# This workflow intentionally uses workflow_run.
# It does not checkout code or download artifacts from the triggering run.
# It only reads workflow_run metadata and sends a Zulip notification.
# It has no GITHUB_TOKEN permissions.
# Review carefully before adding any steps or dependencies.

name: Security Check Notifications

on:
    workflow_run: # zizmor: ignore[dangerous-triggers]
        workflows:
            - Workflow Security Checks
            - Verify Actions Lock
        types:
            - completed

permissions: {}

jobs:
    notify:
        if: >-
            github.event.workflow_run.repository.full_name ==
            github.repository &&
            contains(
              fromJSON('["pull_request","push"]'),
              github.event.workflow_run.event
            )

        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Send security notification via Zulip
              shell: bash
              env:
                  ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
                  ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
                  ZULIP_URL: https://maurodatamapper.zulipchat.com
                  ZULIP_STREAM: build/github-actions
                  ZULIP_TOPIC: ${{github.repository}}

                  WORKFLOW: ${{ github.event.workflow_run.name }}
                  CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  REPOSITORY: ${{ github.repository }}
                  BRANCH: ${{ github.event.workflow_run.head_branch }}
                  ACTOR: ${{ github.event.workflow_run.actor.login }}
                  COMMIT: ${{ github.event.workflow_run.head_sha }}
                  EVENT: ${{ github.event.workflow_run.event }}
                  ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  RUN_URL: ${{ github.event.workflow_run.html_url }}
                  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
                  HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
                  SERVER_URL: ${{ github.server_url }}

              run: |
                  set -euo pipefail

                  if [[ -n "$PR_NUMBER" ]]; then
                    SOURCE_LINK="[View pull request]($SERVER_URL/$REPOSITORY/pull/$PR_NUMBER)"
                  else
                    SOURCE_LINK="[View commit]($SERVER_URL/$HEAD_REPOSITORY/commit/$COMMIT)"
                  fi
                  
                  case "$CONCLUSION" in
                    success)
                      STATUS=":check_mark: "
                      ;;
                    failure)
                      STATUS=":cross_mark: "
                      ;;
                    cancelled)
                      STATUS=":warning: (CANCELLED)"
                      ;;
                    skipped)
                      STATUS=":warning: (SKIPPED)"
                      ;;
                    timed_out)
                      STATUS=":warning: (TIMED OUT)"
                      ;;
                    action_required)
                      STATUS=":warning: (ACTION REQUIRED)"
                      ;;
                    *)
                      STATUS=":warning: (${CONCLUSION:-UNKNOWN})"
                      ;;
                  esac
                  
                  MESSAGE="$STATUS **$REPOSITORY** ($WORKFLOW)
                  $BRANCH / $ACTOR ($EVENT)
                  ${COMMIT:0:12} (Attempt $ATTEMPT)
                  [View workflow run]($RUN_URL)
                  $SOURCE_LINK"
                  
                  curl \
                    --fail-with-body \
                    --silent \
                    --show-error \
                    --retry 3 \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --user "$ZULIP_BOT_EMAIL:$ZULIP_API_KEY" \
                    --data-urlencode "type=stream" \
                    --data-urlencode "to=$ZULIP_STREAM" \
                    --data-urlencode "topic=$ZULIP_TOPIC" \
                    --data-urlencode "content=$MESSAGE" \
                    https://maurodatamapper.zulipchat.com/api/v1/messages

              continue-on-error: true