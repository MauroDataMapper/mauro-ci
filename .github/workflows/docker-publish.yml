name: Docker Hub Publish

on:
    workflow_call:
        inputs:
            java-version:
                type: string
                default: "17"

        secrets:
            DOCKERHUB_USERNAME:
                required: true
            DOCKERHUB_PASSWORD:
                required: true

permissions: {}

jobs:
    publish:
        if: >-
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'

        runs-on: ubuntu-latest
        timeout-minutes: 60

        environment: dockerhub

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v6.1.0
              with:
                  persist-credentials: false

            - name: Setup Java and Gradle
              uses: $/actions/setup-gradle-java
              with:
                  java-version: ${{ inputs.java-version }}

            - name: Setup Docker
              uses: $/actions/setup-docker-buildx

            - name: Build and publish image
              env:
                  GRADLE_OPTS: >-
                      -Xmx4g -XX:MaxMetaspaceSize=512m
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
              run: |
                  ./gradlew \
                    --stacktrace \
                    --no-daemon \
                    --max-workers=1 \
                    -PenableOpenApi=true \
                    -PopenApiGeneratorMaxHeap=4g \
                    dockerBuildMultiArch