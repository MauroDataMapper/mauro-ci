name: Verify Actions Lock

on:
    pull_request:
    push:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Verify lockfile
              run: gh actions-lock --verify