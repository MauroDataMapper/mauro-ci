name: Upload JUnit results
description: Upload JUnit XML results as a workflow artifact

inputs:
    artifact-name:
        description: Name of the uploaded artifact
        required: true

    path:
        description: JUnit XML file or files to upload
        required: true

    retention-days:
        description: Number of days to retain the artifact
        required: false
        default: "7"

    if-no-files-found:
        description: Action to take when no files match path
        required: false
        default: warn

outputs:
    artifact-id:
        description: ID of the uploaded artifact
        value: ${{ steps.upload.outputs.artifact-id }}

runs:
    using: composite
    steps:
        - name: Upload JUnit artifact
          id: upload
          if: always()
          uses: actions/upload-artifact@v7.0.2
          with:
              name: ${{ inputs.artifact-name }}
              path: ${{ inputs.path }}
              retention-days: ${{ inputs.retention-days }}
              if-no-files-found: ${{ inputs.if-no-files-found }}
