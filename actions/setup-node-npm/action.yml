name: Setup Node.js and install dependencies
description: Configure Node.js and npm, cache npm packages, and run npm ci

inputs:
    node-version:
        description: Node.js version to set up
        required: false
        default: "24"

    npm-version:
        description: Optional npm version to install
        required: false
        default: ""

    working-directory:
        description: Directory containing the package lockfile
        required: false
        default: "."

    cache-dependency-path:
        description: Path to the package lockfile, relative to the workspace
        required: false
        default: package-lock.json

runs:
    using: composite
    steps:
        - name: Set up Node.js
          uses: actions/setup-node@v7.1.0
          with:
              node-version: ${{ inputs.node-version }}
              cache: npm
              cache-dependency-path: ${{ inputs.cache-dependency-path }}

        - name: Set up npm version
          if: inputs.npm-version != ''
          shell: bash
          env:
              NPM_VERSION: ${{ inputs.npm-version }}
          run: npm install --global "npm@$NPM_VERSION"

        - name: Install dependencies
          shell: bash
          working-directory: ${{ inputs.working-directory }}
          run: npm ci
